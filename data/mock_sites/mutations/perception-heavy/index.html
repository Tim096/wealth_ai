<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MockShop — Search</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; }
  header { border-bottom:2px solid #333; padding-bottom:.5rem; }
  #results li { margin:.4rem 0; }
  .decoy { color:#999; }
  .cookie-modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex;
    align-items:center; justify-content:center; z-index:10; }
  .cookie-modal .box { background:#fff; padding:2rem; border-radius:8px; }
</style>
</head>
<body>
<header><h1>MockShop</h1></header>
<!-- generated by tools/gen_mutation_sites.py — cell perception-heavy (do not hand-edit) -->
<div class="cookie-modal" id="cookie"><div class="box"><p>We use cookies.</p><button id="accept-cookies" onclick="document.getElementById('cookie').remove()">Accept</button></div></div>
<label>Promo code <input id="promo" name="promo" type="text" placeholder="Promo code"></label>
<input id="ghost" type="text" style="display:none" aria-label="Search products">
<form id="finder" onsubmit="return doSearch(event)">
  <input id="term-entry" name="term" type="text" placeholder="Type here..." data-sb="1">
  <div role="button" id="go-act" aria-label="Search" onclick="return doSearch(event)">Go</div>
</form>
<ul id="results"></ul>
<script>
const CATALOG = [
  "Widget Pro 3000", "Widget Mini", "Gizmo Deluxe", "Gadget Standard",
  "Sprocket XL", "Cog Basic", "Widget Ultra", "Bolt Pack"
];
// deterministic fault schedule — no randomness, every run replays identically
const DELAY_MS = 0;
const FAIL_FIRST = false;
const REBUILD_ON_INPUT = false;
const SWAP_BUTTON_ON_INPUT = false;
let attempt = 0, mutated = false;

function box() { return document.querySelector('[data-sb]'); }

function setStatus(text) {
  let s = document.getElementById('result-status');
  if (!s) {
    s = document.createElement('div');
    s.id = 'result-status';
    const ul = document.getElementById('results');
    ul.parentNode.insertBefore(s, ul);
  }
  s.textContent = text;
}

function renderHits(q) {
  const hits = CATALOG.filter(x => x.toLowerCase().includes(q));
  const ul = document.getElementById('results');
  ul.innerHTML = '';
  hits.forEach(function (name) {
    const li = document.createElement('li');
    li.className = 'result-item';
    li.textContent = name;
    ul.appendChild(li);
  });
  setStatus(hits.length + ' results for "' + q + '"');
}

function doSearch(e) {
  e.preventDefault();
  const q = (box() ? box().value : '').toLowerCase();
  // empty query must NOT dump the whole catalog (that would let a wrong-field
  // fill still "succeed" and mask the perception failure)
  if (!q) { setStatus('Enter a search term'); return false; }
  attempt++;
  if (FAIL_FIRST && attempt === 1) {
    setStatus('Server error (500). Please retry.');
    return false;
  }
  if (DELAY_MS > 0) { setTimeout(function () { renderHits(q); }, DELAY_MS); }
  else { renderHits(q); }
  return false;
}

// stale-snapshot fault: the nodes the agent already observed are REPLACED by
// new nodes (new ids, old data-aid handles die); the typed value is preserved
function rebuildForm() {
  const old = box();
  const ni = document.createElement('input');
  ni.type = 'text'; ni.id = 'sb1'; ni.name = 'q2';
  ni.setAttribute('aria-label', 'Search products');
  ni.setAttribute('data-sb', '1');
  ni.value = old.value;
  const ob = document.querySelector('#finder button, #finder [role=button], #finder span');
  const nb = document.createElement('button');
  nb.type = 'submit'; nb.id = 'btn1';
  nb.setAttribute('aria-label', 'Search');
  nb.textContent = 'Go';
  old.replaceWith(ni);
  if (ob) ob.replaceWith(nb);
}

// mid-task removal: the submit control that existed when the task started is
// gone by the time the agent clicks it; a differently-identified one appears
function swapButton() {
  const ob = document.getElementById('search-btn');
  if (!ob) return;
  const nb = document.createElement('button');
  nb.type = 'submit'; nb.id = 'resubmit';
  nb.setAttribute('aria-label', 'Search');
  nb.textContent = 'Submit';
  ob.replaceWith(nb);
}

// event-anchored (not timer-raced) mutation trigger: fires once, right after
// the first input lands in the real search field
document.addEventListener('input', function (ev) {
  if (!ev.target.hasAttribute || !ev.target.hasAttribute('data-sb')) return;
  if (mutated) return;
  mutated = true;
  if (REBUILD_ON_INPUT) setTimeout(rebuildForm, 0);
  if (SWAP_BUTTON_ON_INPUT) setTimeout(swapButton, 0);
});
</script>
</body>
</html>
