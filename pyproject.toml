[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-test-2026"
version = "0.1.0"
description = "AI reliability platform proven on two hard tasks: a capability-aware browser agent and a SEC 10-K item-level extractor."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
browser = [
    "playwright>=1.45",
    "httpx>=0.27",
]
sec = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "edgartools==5.42.0",  # third-engine triangulation (sec_core.third_engine)
]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
"" = "packages"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that drive a real browser (Playwright)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
