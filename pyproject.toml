[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-test-2026"
version = "0.1.0"
description = "AI reliability platform proven on two hard tasks: a capability-aware browser agent and a SEC 10-K item-level extractor."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "py7zr>=1.0",  # NTU itemseg dataset unpack (tools/fetch_ntu_itemseg.py, lazy import)
    "matplotlib>=3.8",  # calibration curve rendering (tools/calibrate_sec_confidence.py, lazy import)
]
browser = [
    "playwright>=1.45",
    "httpx>=0.27",
]
sec = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "edgartools==5.42.0",  # third-engine triangulation (sec_core.third_engine)
    "datamule==5.0.1",  # fifth arbitration vote (sec_core.engines.datamule_vote); MIT,
                        # survey pinned upstream commit 122fc54 — see docs/ATTRIBUTION.md
]
# Runtime deps of the UNMODIFIED edgar-crawler CLI (fourth arbitration vote),
# which sec_core.engines.edgar_crawler_vote runs arms-length in a subprocess on
# a gitignored local checkout. edgar-crawler itself (GPLv3) is NEVER a
# dependency, vendored, or imported — these are only the permissive libraries
# its process needs when run under our interpreter.
crawler-vote = [
    "click>=8.0",
    "cssutils>=2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pathos>=0.3",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
"" = "packages"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that drive a real browser (Playwright)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
