<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MockShop — Search</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; }
  header { border-bottom:2px solid #333; padding-bottom:.5rem; }
  #hits td { padding:.3rem .6rem; }
</style>
</head>
<body>
<header><h1>MockShop</h1></header>

<!-- v3 (HELD-OUT): a structure the agent has never seen — different again from v1/v2.
     - search field is a <textarea role="searchbox"> (not <input>)
     - submit is an <a role="button"> (not <button>)
     - results render into a <table>
     - no modal, no decoy — pure "can the a11y-tree repair generalize to unseen UI?" -->

<form id="finder" onsubmit="return doSearch(event)">
  <textarea id="q3" role="searchbox" name="term" placeholder="Search products" aria-label="Search products" rows="1"></textarea>
  <a href="#" role="button" id="run" aria-label="Search" onclick="return doSearch(event)">Go</a>
</form>

<table id="hits"><tbody></tbody></table>

<script>
const CATALOG = [
  "Widget Pro 3000", "Widget Mini", "Gizmo Deluxe", "Gadget Standard",
  "Sprocket XL", "Cog Basic", "Widget Ultra", "Bolt Pack"
];
function doSearch(e) {
  e.preventDefault();
  const q = document.getElementById('q3').value.toLowerCase();
  const hits = CATALOG.filter(x => x.toLowerCase().includes(q));
  const tb = document.querySelector('#hits tbody');
  tb.innerHTML = '';
  hits.forEach(function(name) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.className = 'result-item';
    td.textContent = name;
    tr.appendChild(td);
    tb.appendChild(tr);
  });
  const status = document.createElement('div');
  status.id = 'result-status';
  status.textContent = hits.length + ' results for "' + q + '"';
  document.body.appendChild(status);
  return false;
}
</script>
</body>
</html>
